services:
  - type: web
    name: voting-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: true
    disk:
      name: voting-db
      mountPath: /data
      sizeGB: 1
